name: validate-and-build

on:
  push:
    branches: [main]
    paths:
      - "entries/**"
      - "riskpairs.json"
      - "schema/**"
      - "scripts/build_atlas.py"
  pull_request:
    paths:
      - "entries/**"
      - "riskpairs.json"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate
        run: python3 scripts/build_atlas.py --check

      - name: Build atlas.json
        if: github.event_name == 'push'
        run: python3 scripts/build_atlas.py

      - name: Commit atlas.json
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- atlas.json; then
            echo "atlas.json 无变化"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add atlas.json
          git commit -m "build: regenerate atlas.json"
          git push
